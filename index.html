<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 8</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>


<body>
    <input type="text" name="tx" id="tx">
    <input id="btn" type ="button" name="colorbtn" value="Change Background Color" onclick="bgcolor()">

   <!-- code refers to: https://medium.com/@design.codder12/how-to-change-background-color-using-javascript-multiple-methods-explained-eb9afc0f1eb9-->
    <script>
        let button = document.getElementById('btn');
        function bgcolor()
        {
            let col = document.getElementById('tx').value;
            document.body.style.backgroundColor = col;
        }
    </script>

</body>
</html>
